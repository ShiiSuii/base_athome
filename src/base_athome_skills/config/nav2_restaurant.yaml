# ==============================================================================
# Overlay Nav2 para la prueba Restaurant (Mapeo online con SLAM Toolbox)
# Se aplica encima de src/base_athome_navigation/config/nav2_params.yaml
# ==============================================================================

planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        scan:
          max_obstacle_height: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: "map"
      track_unknown_space: true
      obstacle_layer:
        scan:
          max_obstacle_height: 2.0
