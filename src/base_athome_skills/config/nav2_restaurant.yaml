# ==============================================================================
# Overlay Nav2 para la prueba Restaurant (Mapeo online con SLAM Toolbox)
# Se aplica encima de src/base_athome_navigation/config/nav2_params.yaml
# ==============================================================================

planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        scan:
          max_obstacle_height: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: "map"
      # SLAM online empieza con un mapa pequeno/asimetrico por /scan_nav (+-100 grados).
      # En Nav2 Jazzy una ventana movil conserva su tamano, en vez de redimensionarse
      # al OccupancyGrid de StaticLayer: la base queda centrada incluso al inicio.
      # StaticLayer sigue aportando el mapa SLAM; fuera de lo observado sigue desconocido.
      rolling_window: true
      width: 20
      height: 20
      track_unknown_space: true
      obstacle_layer:
        scan:
          max_obstacle_height: 2.0

# Giro inicial de Restaurant (Spin de Nav2) mas lento: el usuario lo vio demasiado rapido. En Jazzy el Spin lee estos
# parametros en la raiz de behavior_server (no bajo "spin:"), asi que el 0.8 de nav2_params.yaml no se aplicaba y giraba
# al valor por defecto (1.0 rad/s, aceleracion 3.2).
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.40     # rad/s (~23 grados/s)
    min_rotational_vel: 0.30     # menos y la base del hoverboard puede no arrancar
    rotational_acc_lim: 0.8
