teleop_twist_joy_node:
  ros__parameters:

    # -----------------------------
    #  Stick izquierdo (Linear y Angular)
    # -----------------------------
    axis_linear:
      x: 1               # Stick izquierdo vertical
    scale_linear:
      x: 0.40            # Velocidad normal (0.40 m/s)
    scale_linear_turbo:
      x: 0.85            # Turbo con R2 (0.85 m/s)

    axis_angular:
      yaw: 0             # Stick izquierdo horizontal
    scale_angular:
      yaw: 0.80          # Giro suave (0.80 rad/s)
    scale_angular_turbo:
      yaw: 1.20          # Giro rápido en turbo

    # -----------------------------
    # Botones
    # -----------------------------
    enable_button: 5           # R1  (Hombre muerto - mantener presionado)
    enable_turbo_button: 7     # R2  (Turbo)

    require_enable_button: true
