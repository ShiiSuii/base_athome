# ==============================================================================
# CONFIGURACIÓN NAV2 (ROS 2 Jazzy) - ROBOT SOLVER (Hoverboard Diferencial)
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    laser_model_type: "likelihood_field"
    sigma_hit: 0.2
    z_hit: 0.6
    z_rand: 0.4
    laser_min_range: 0.05
    laser_max_range: 10.0
    max_beams: 100

    min_particles: 500
    max_particles: 2000
    resample_interval: 1
    transform_tolerance: 1.0

    update_min_d: 0.05
    update_min_a: 0.10

    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: "map"
    yaml_filename: "/home/athome/mapa_base_athome.yaml"


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.35
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      smooth_path: true
      cost_travel_multiplier: 1.0
      use_final_approach_orientation: false


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0

    # Plugins
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    current_progress_checker: "progress_checker"
    current_goal_checker: "goal_checker"

    transform_tolerance: 0.5
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # ----- Progress checker -----
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 30.0

    # ----- Goal checker -----
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 0.10   # ~5.7 grados (orientación precisa y estable en RViz2)
      stateful: true

    # ----- Controller: Rotation Shim Controller wrapping Regulated Pure Pursuit -----
    # Combina seguimiento fino de trayectorias (RPP) con giro en el lugar exacto (Shim)
    # tanto en la salida como al llegar a la pose final (rotate_to_goal_heading: true).
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Parámetros de Giro en el Lugar (Rotation Shim) ---
      angular_dist_threshold: 0.785          # 45 deg: gira sobre su eje si el error inicial excede esto
      angular_disengage_threshold: 0.3925    # 22.5 deg: transfiere suavemente el control a RPP
      forward_sampling_distance: 0.50        # Distancia para evaluar orientación del path inicial
      rotate_to_heading_angular_vel: 0.70    # rad/s (~40 deg/s: giro calmado, suave y controlado en el lugar)
      max_angular_accel: 1.8                 # rad/s^2 (aceleracion suave sin sacudidas)
      simulate_ahead_time: 0.6               # 0.6s de proyección para evitar falsos abortos cerca de obstáculos
      rotate_to_goal_heading: true           # CLAVE: al llegar a tolerancia XY, rota sobre el eje a la orientación exacta de RViz2
      rotate_to_heading_once: false
      use_path_orientations: false

      # --- Parámetros de Regulated Pure Pursuit (Seguimiento de Trayectoria) ---
      desired_linear_vel: 0.38               # Velocidad crucero segura y controlada (m/s)
      lookahead_dist: 0.65                   # Lookahead base
      min_lookahead_dist: 0.58               # > ancho de vía (0.562m) para eliminar temblores/oscilaciones
      max_lookahead_dist: 1.00
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.16     # Piso de velocidad en tramo final antes de rotar
      approach_velocity_scaling_dist: 0.60   # Rango de aproximación
      max_linear_accel: 1.2
      max_angular_vel: 1.1                   # rad/s (giro maximo en curva acotado)
      max_angular_accel: 2.0                 # rad/s^2

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.20
      regulated_linear_scaling_min_radius: 0.90
      use_cost_regulated_linear_velocity_scaling: false

      use_rotate_to_heading: false           # Delegado 100% al RotationShimController
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.5
      use_interpolation: true


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: "/odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    default_bt_xml_filename: "/home/athome/base_athome_ws/src/base_athome_navigation/config/bt_trees/base_athome_bt.xml"
    default_nav_to_pose_bt_xml: "/home/athome/base_athome_ws/src/base_athome_navigation/config/bt_trees/base_athome_bt.xml"
    enable_groot_monitoring: false
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"


behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_footprint"
    transform_tolerance: 0.5

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"
      max_rotational_vel: 0.8
      min_rotational_vel: 0.35
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "odom"
      robot_base_frame: "base_footprint"
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.44
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.59
      always_send_full_costmap: True


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_footprint"
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.44
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.59
      always_send_full_costmap: True