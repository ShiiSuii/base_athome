[pytest]
testpaths = tests
pythonpath = .
# Con ROS 2 sourceado, PYTHONPATH expone plugins pytest de ROS (launch_testing, ament_*)
# que no son necesarios aqui y fallan dentro del venv. Se desactivan explicitamente.
addopts = -p no:launch_testing -p no:launch_pytest -p no:launch_ros
          -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257
          -p no:ament_xmllint -p no:ament_lint
