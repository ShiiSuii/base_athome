<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debug Base@Home</title>
<style>
:root{--bg:#10151b;--pn:#18202a;--pn2:#202b37;--tx:#e8edf2;--mu:#93a1b0;--li:#2c3947;--robot:#3fb97f;--gazebo:#4d9de0;--simulador:#7f8ce8;--tests:#c99bf0;--parcial:#e6b34d;--falta:#e8695f;--sc:#7a8794}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{padding:16px 22px;background:var(--pn);border-bottom:1px solid var(--li);display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
h1{font-size:19px;margin:0 auto 0 0}h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu)}
main{padding:18px 22px;display:grid;gap:18px;max-width:1500px;margin:auto}.pn{background:var(--pn);border:1px solid var(--li);border-radius:9px;padding:15px}
.modo{font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pn2)}.modo.real{background:var(--falta);color:#fff}.modo.sim{background:var(--gazebo);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:12px}.st{background:var(--pn2);padding:11px;border-radius:7px}
.num{font-size:25px;font-weight:700}.bar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--li);margin:7px 0}.bar i{display:block}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#10151b;white-space:nowrap}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-top:1px solid var(--li);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px;border-top:0}
.warn{color:var(--parcial)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}button{background:var(--pn2);color:var(--tx);border:1px solid var(--li);padding:5px 11px;border-radius:6px;cursor:pointer;font:inherit}button.on{background:var(--gazebo);border-color:var(--gazebo);color:#fff}
.alert{border-left:4px solid var(--parcial);background:var(--pn2);padding:8px 11px;border-radius:5px;margin-bottom:8px}.wrap{overflow-x:auto}
@media(max-width:640px){main,header{padding:12px}}
</style></head><body>
<header><h1>Debug Base@Home</h1><span id="modo" class="modo">…</span><span id="git" class="mu"></span><span id="hora" class="mu"></span></header>
<main>
<section class="pn"><h2>Capacidades</h2><div id="res" class="grid"></div><div id="leyenda" class="mu" style="margin-top:9px;font-size:12.5px"></div></section>
<section class="pn"><h2>Pruebas de la categoría (OPL)</h2><div id="prs" class="grid"></div><div class="tabs" id="tabs" style="margin-top:13px"></div><div class="wrap" id="items"></div></section>
<section class="pn"><h2>GPSR: comandos oficiales que compilan</h2><div id="cob"></div></section>
<section class="pn"><h2>Qué sabe y qué falta</h2><div class="tabs" id="filtro"></div><div id="avisos"></div><div class="wrap"><table id="caps"></table></div></section>
<section class="pn"><h2>Skills que el commander puede usar</h2><div id="sk"></div></section>
<section class="pn"><h2>Última regresión en simulación</h2><div id="esc" class="wrap"></div></section>
<section class="pn"><h2>Corriendo ahora</h2><div id="procs" class="mu"></div></section>
</main>
<script>
const N={robot:'En el robot',gazebo:'En Gazebo',simulador:'Simulador liviano',tests:'Solo tests',parcial:'Parcial',falta:'Falta',sin_clasificar:'Sin clasificar'};
const C=k=>`var(--${k==='sin_clasificar'?'sc':k})`,tag=k=>`<span class="tag" style="background:${C(k)}">${N[k]||k}</span>`;
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let D,tab='GPSR',fil='todas';
function pinta(){const d=D;const m=document.getElementById('modo');m.textContent=d.vivo.modo;m.className='modo '+(d.vivo.modo==='robot real'?'real':d.vivo.modo==='simulación'?'sim':'');
git.textContent=`${d.rama} · ${d.commit.slice(0,60)}${d.sucio.length?` · ${d.sucio.length} sin commitear`:''}`;hora.textContent='actualizado '+d.hora;
const T=d.capacidades.length,c=d.conteo;res.innerHTML=[['robot','Ya lo sabe, en el robot'],['gazebo','Funciona en Gazebo'],['simulador','En simulador liviano'],['tests','Escrito, con tests'],['parcial','A medias'],['falta','Falta aprender']].map(([k,t])=>`<div class="st"><div class="num" style="color:${C(k)}">${c[k]||0}<span class="mu" style="font-size:14px"> / ${T}</span></div>${t}</div>`).join('');
leyenda.textContent='Nada pasa a "En el robot" sin una prueba real. Compilar o pasar en simulación no demuestra que funcione ni que sea seguro en el robot.';
prs.innerHTML=Object.entries(d.pruebas).map(([k,p])=>{const w=x=>p.total?100*x/p.total:0;return `<div class="st"><b>${e(d.nombres[k]||k)}</b><div class="bar"><i style="width:${w(p.robot)}%;background:var(--robot)"></i><i style="width:${w(p.avance)}%;background:var(--parcial)"></i></div><span class="mu">${p.robot} en robot · ${p.avance} en camino · ${p.falta} faltan${p.sin_desglosar?` · ${p.sin_desglosar} sin desglosar`:''} · ${p.total} pts</span></div>`}).join('')+Object.entries(d.sin_desglose||{}).map(([k,t])=>`<div class="st"><b>${e(k)}</b><div class="mu" style="margin-top:6px">${e(t)}</div></div>`).join('');
tabs.innerHTML=Object.keys(d.pruebas).map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';pinta()">${k}</button>`).join('');
const P=d.pruebas[tab];items.innerHTML=P?`<table><tr><th>Ítem</th><th>Pts</th><th>Estado</th><th>Capacidad</th></tr>${P.items.map(i=>`<tr><td>${e(i.id)} ${e(i.titulo)}</td><td>${i.puntos}</td><td>${tag(i.etapa)}</td><td class="mu">${e(i.capacidad||'—')}</td></tr>`).join('')}</table>`:'';
const co=d.cobertura;if(co){const cats=Object.keys(co.total);const ok=cats.reduce((a,k)=>a+(co.ok[k]||0),0),t=cats.reduce((a,k)=>a+co.total[k],0);cob.innerHTML=`<div class="num">${ok}<span class="mu" style="font-size:14px"> / ${t}</span></div><div class="grid" style="margin:8px 0">${cats.map(k=>`<div class="st">${e(k)}: <b>${co.ok[k]||0}</b> / ${co.total[k]}<div class="bar"><i style="width:${100*(co.ok[k]||0)/co.total[k]}%;background:var(--gazebo)"></i></div></div>`).join('')}</div><span class="mu">Sin LLM. Compilar no es ejecutar. Lo que bloquea: ${co.motivos.map(([a,b])=>`${e(a)} (${b})`).join(' · ')}</span>`}else cob.textContent='No se pudo calcular.';
let av='';const ch=d.capacidades.filter(x=>x.cambio&&x.cambio.length);
if(ch.length)av+=`<div class="alert">⚠ Cambió el código después de la última prueba: ${ch.map(x=>e(x.nombre)).join(', ')}.</div>`;if(d.sin_clasificar.length)av+=`<div class="alert">Ítems de la matriz sin capacidad: ${d.sin_clasificar.join(', ')}.</div>`;avisos.innerHTML=av;
filtro.innerHTML=['todas','robot','gazebo','simulador','tests','parcial','falta'].map(k=>`<button class="${k===fil?'on':''}" onclick="fil='${k}';pinta()">${k==='todas'?'Todas':N[k]}</button>`).join('');
caps.innerHTML=`<tr><th>Capacidad</th><th>Área</th><th>Estado</th><th>Qué falta</th></tr>`+d.capacidades.filter(x=>fil==='todas'||x.etapa===fil).map(x=>`<tr><td>${e(x.nombre)}${x.cambio&&x.cambio.length?' <span class="warn" title="Cambió después de la última prueba">⚠</span>':''}</td><td class="mu">${e(x.area)}</td><td>${tag(x.etapa)}</td><td class="mu">${e(x.falta||'')}</td></tr>`).join('');
const s=d.escenarios;esc.innerHTML=s?`<span class="mu">${s.filas.filter(f=>f.ok).length}/${s.filas.length} pasaron, cada uno en su última corrida</span><table><tr><th>Escenario</th><th>Resultado</th><th>Pinza</th><th>Cuándo</th><th>Motivo</th></tr>${s.filas.map(f=>`<tr><td>${e(f.nombre)}</td><td style="color:${f.ok?'var(--robot)':'var(--falta)'}">${f.ok?'pasó':'falló'}</td><td>${f.cm==null?'—':f.cm+' cm'}</td><td class="mu">${e(f.cuando)} · ${e(f.modo)} · ${e(f.commit)}</td><td class="mu">${e(f.detalle||'')}</td></tr>`).join('')}</table>`:'<span class="mu">Sin resultados guardados: se llena al correr simulation/scripts/sim_escenarios.py.</span>';
const S=d.skills||[];sk.innerHTML=`<span class="mu">${S.filter(x=>x.status==='available').length} disponibles de ${S.length}. Disponible significa que está registrada, no que funcione en el robot.</span><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${S.map(x=>`<span class="tag" title="${e(x.description)}" style="background:${x.status==='available'?'var(--pn2);color:var(--tx)':'var(--falta)'}">${e(x.name)}</span>`).join('')}</div>`;
const pr=Object.entries(d.vivo.procesos);procs.textContent=pr.length?pr.map(([a,b])=>`${a} (dominio ${b})`).join(' · '):'Nada del robot corriendo.'}
async function trae(){try{const n=await (await fetch('/api/state')).json();if(D&&D.pagina!==n.pagina)return location.reload();D=n;pinta()}catch(x){hora.textContent='sin conexión con el tablero'}}
D=/*ESTADO*/null;if(D)pinta();trae();setInterval(trae,4000);
</script></body></html>
