# Mapa semantico SOLO para simulacion (ROS_DOMAIN_ID=42). No es el mapa operativo y no lo reemplaza.
# door/living_room copian el mapa real (2026-11-03); reception/table/kitchen/home son ficticios.
# En base_athome_sim el objeto esta fijo respecto del robot (frente a la pinza en PRE-GRASP).
waypoints:
  door: {x: 3.06, y: -0.14, yaw_deg: -2}
  reception: {x: 2.6, y: -0.6, yaw_deg: 180}
  living_room: {x: 0.19, y: -7.26, yaw_deg: -1}
  table: {x: 1.2, y: -4.5, yaw_deg: -90}
  kitchen: {x: 1.5, y: -3.0, yaw_deg: 90}
  home: {x: 0.0, y: 0.0, yaw_deg: 0}
  instruction_point: {x: 1.0, y: 0.0, yaw_deg: 180}
  trash_drop: {x: 4.0, y: 1.5, yaw_deg: 0}
furniture:
  mesa_sim:
    name: Mesa Sim
    type: table
    height_m: 0.76
    polygon: [[0.8, -6.0], [1.6, -6.0], [1.6, -5.2], [0.8, -5.2]]
    center: {x: 1.2, y: -5.6, z: 0.38}
  mesa_sin_nada:
    name: Mesa Sin Nada
    type: table
    height_m: 0.76
    polygon: [[-2.0, -6.0], [-1.2, -6.0], [-1.2, -5.2], [-2.0, -5.2]]
    center: {x: -1.6, y: -5.6, z: 0.38}
objects:
  obj_1: {number: 1, name: agua, class: bottle, x: 1.2, y: -5.3, z: 0.86, 'on': mesa_sim, approach: {x: 1.2, y: -4.7, yaw_deg: -90}}
  obj_2: {number: 2, name: taza, class: cup, x: 1.45, y: -5.6, z: 0.86, 'on': mesa_sim, approach: {x: 2.1, y: -5.6, yaw_deg: 180}}
