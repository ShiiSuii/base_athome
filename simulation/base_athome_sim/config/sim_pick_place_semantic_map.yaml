# Mapa semantico para el mundo de simulacion casa_pick_place (ROS_DOMAIN_ID=42/77).
# Define zonas, waypoints, muebles (mesa, estante, lavavajillas, tacho) y objetos de Pick and Place.

map_info:
  yaml_file: simulation/config/casa_pick_place.yaml
  image_file: simulation/config/casa_pick_place.pgm
  resolution: 0.05
  origin: [-5.0, -5.0, 0.0]

zones:
  living_room:
    name: Sala de Estar
    type: living_room
    polygon: [[-2.5, -2.5], [1.0, -2.5], [1.0, 1.5], [-2.5, 1.5]]
  dining_room:
    name: Comedor
    type: dining_room
    polygon: [[1.0, -2.8], [3.5, -2.8], [3.5, -0.2], [1.0, -0.2]]
  kitchen:
    name: Cocina
    type: kitchen
    polygon: [[-1.0, 1.2], [4.8, 1.2], [4.8, 2.95], [-1.0, 2.95]]
  entrance:
    name: Entrada
    type: entrance
    polygon: [[-2.9, -1.0], [-1.5, -1.0], [-1.5, 1.0], [-2.9, 1.0]]

waypoints:
  home: {x: 0.0, y: 0.0, yaw_deg: 0}
  door: {x: -2.0, y: 0.0, yaw_deg: 180}
  entrance: {x: -2.0, y: 0.0, yaw_deg: 180}
