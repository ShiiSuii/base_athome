  kitchen: {x: 2.0, y: 1.5, yaw_deg: 90}
  dining_room: {x: 1.5, y: -0.6, yaw_deg: -90}
  table: {x: 2.0, y: -0.6, yaw_deg: -90}
  mesa: {x: 2.0, y: -0.6, yaw_deg: -90}
  dining_table: {x: 2.0, y: -0.6, yaw_deg: -90}
  shelf: {x: 0.0, y: 1.9, yaw_deg: 90}
  estante: {x: 0.0, y: 1.9, yaw_deg: 90}
  cabinet: {x: 0.0, y: 1.9, yaw_deg: 90}
  dishwasher: {x: 3.0, y: 1.8, yaw_deg: 90}
  lavavajillas: {x: 3.0, y: 1.8, yaw_deg: 90}
  trash_bin: {x: 4.2, y: 1.8, yaw_deg: 90}
  tacho: {x: 4.2, y: 1.8, yaw_deg: 90}
  trash: {x: 4.2, y: 1.8, yaw_deg: 90}
