# Perfil de evaluacion de Nav2. SOLO SIMULACION: no reemplaza src/base_athome_navigation/config/nav2_params.yaml.
# Se aplica encima de ese archivo (solo cambia lo que esta aca) con ATHOME_NAV_PROFILE=eval en sim_commander.sh.
# Origen: revision de la configuracion del 2026-11-09. Antes de usarlo en el robot hay que medir si el brazo sobresale.
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.36          # 0.44: el chasis mide 0.48 x 0.48 (medio diagonal 0.34); con 0.44 no pasa una puerta de 85 cm
      obstacle_layer:
        scan:
          max_obstacle_height: 2.0  # FALTA en el del robot: en Jazzy vale 0.0 y descarta todo el lidar (esta a 0.38 m)
      width: 5                    # 3: el controlador veia solo 1.5 m adelante
      height: 5
      inflation_layer:
        inflation_radius: 0.75    # 0.59: costo mas suave, rutas mas centradas en los pasillos
        cost_scaling_factor: 2.5  # 4.0
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        scan:
          max_obstacle_height: 2.0  # FALTA en el del robot: en Jazzy vale 0.0 y descarta todo el lidar (esta a 0.38 m)
      robot_radius: 0.36
      inflation_layer:
        inflation_radius: 0.75
        cost_scaling_factor: 2.5
controller_server:
  ros__parameters:
    progress_checker:
      movement_time_allowance: 12.0        # 30: dejaba empujar 30 s contra algo que el lidar no ve
    FollowPath:
      use_cost_regulated_linear_velocity_scaling: true   # mas lento cerca de obstaculos y personas
amcl:
  ros__parameters:
    laser_max_range: 5.0           # 10: el Hokuyo UST-05LX llega a unos 5 m
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: bt_eval.xml   # espera a que se corran antes de limpiar y abortar
