# Mapa semantico SOLO para la ARENA de simulacion (worlds/arena.sdf, ROS_DOMAIN_ID=42/77). No es el mapa operativo.
# Casa de 14 x 10 m (X -3.5..10.5, Y -4..6) con hall, living, dormitorio, cocina, comedor/restaurante y lavadero.
# Las coordenadas salen del .sdf (ver su encabezado): cada waypoint cae en celda libre del mapa arena.pgm con el
# radio del robot (0.44 m) libre, y los puntos de aproximacion quedan a ~0.55 m del borde del mueble.

map_info:
  yaml_file: simulation/config/arena.yaml
  image_file: simulation/config/arena.pgm
  resolution: 0.05
  origin: [-4.5, -5.0, 0.0]

zones:
  hall:
    name: Hall de Entrada
    type: entrance
    polygon: [[-3.5, -4.0], [-1.0, -4.0], [-1.0, 2.0], [-3.5, 2.0]]
  living_room:
    name: Living
    type: living_room
    polygon: [[-1.0, -4.0], [5.0, -4.0], [5.0, 2.0], [-1.0, 2.0]]
  bedroom:
    name: Dormitorio
    type: bedroom
    polygon: [[-3.5, 2.0], [0.5, 2.0], [0.5, 6.0], [-3.5, 6.0]]
  kitchen:
    name: Cocina
    type: kitchen
    polygon: [[0.5, 2.0], [5.0, 2.0], [5.0, 6.0], [0.5, 6.0]]
  dining_room:
    name: Comedor
    type: dining_room
    polygon: [[5.0, -1.0], [10.5, -1.0], [10.5, 6.0], [5.0, 6.0]]
  laundry:
    name: Lavadero
    type: laundry
    polygon: [[5.0, -4.0], [10.5, -4.0], [10.5, -1.0], [5.0, -1.0]]

# Puertas (huecos) de la arena: centro y ancho. Las usa el test del mundo; la navegacion no las necesita.
doors:
  hall_living: {x: -1.0, y: -1.0, width_m: 0.90, axis: y}
  hall_bedroom: {x: -2.275, y: 2.0, width_m: 0.90, axis: x}
  living_kitchen: {x: 3.05, y: 2.0, width_m: 0.90, axis: x}
  living_dining: {x: 5.0, y: 0.5, width_m: 0.90, axis: y}
  dining_laundry: {x: 5.775, y: -1.0, width_m: 0.90, axis: x}
  front_door: {x: -2.25, y: -4.0, width_m: 0.90, axis: x, closed: true}

